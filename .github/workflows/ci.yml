name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      - name: Verify @sadel/shared loads at runtime (CommonJS)
        run: node -e "const s=require('@sadel/shared'); if(!s.MENU_THEME_IDS) process.exit(1); console.log('shared loads OK')"
      - run: npm run type-check -w @sadel/web-customer
      - run: npm run type-check -w @sadel/web-admin
      - run: npm run type-check -w @sadel/web-restaurant
      - run: npm run type-check -w @sadel/web-driver
      - run: npm run build -w @sadel/backend
      - name: Verify backend module loads (no ESM resolution crash)
        run: node -e "require('./packages/backend/dist/app')"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      - run: npm run test -w @sadel/backend
        env:
          DATABASE_URL: postgresql://sadel:sadel_test@localhost:5432/sadel_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production
          NODE_ENV: test

  build:
    name: Build web apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      - run: npm run build -w @sadel/web-customer
      - run: npm run build -w @sadel/web-admin
      - run: npm run build -w @sadel/web-restaurant
      - run: npm run build -w @sadel/web-driver
