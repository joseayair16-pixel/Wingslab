<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" />
    <title>SaDeL Repartidor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f6f4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #161616;
      }
      .card { text-align: center; padding: 32px; max-width: 320px; }
      .icon { font-size: 64px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { font-size: 14px; color: #555; margin-bottom: 24px; line-height: 1.5; }
      button {
        background: #161616;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 14px 32px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .hint { margin-top: 16px; font-size: 12px; color: #999; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Sin conexión a Internet</h1>
      <p>No pudimos conectar con el panel de SaDeL. Verifica tu conexión y reintenta.</p>
      <button onclick="window.location.reload()">Reintentar</button>
      <p class="hint">La app se reconectará automáticamente.</p>
    </div>
    <script>
      setInterval(function () { window.location.reload(); }, 15000);
    </script>
  </body>
</html>
