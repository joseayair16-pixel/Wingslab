name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      - name: Verify @sadel/shared loads at runtime (CommonJS)
        run: node -e "const s=require('@sadel/shared'); if(!s.MENU_THEME_IDS) process.exit(1); console.log('shared loads OK')"
      - run: npm run type-check -w @sadel/web-customer
      - run: npm run type-check -w @sadel/web-admin
      - run: npm run type-check -w @sadel/web-restaurant
      - run: npm run type-check -w @sadel/web-driver
      - run: npm run build -w @sadel/backend
      - name: Verify backend module loads (no ESM resolution crash)
        run: node -e "require('./packages/backend/dist/app')"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL efímero y aislado SOLO para este job: credenciales de prueba
    # descartables, base recién creada y destruida al terminar el job. Nunca
    # hay conexión a la base de producción desde CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sadel
          POSTGRES_PASSWORD: sadel_test
          POSTGRES_DB: sadel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sadel -d sadel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      # `prisma db push` y no `migrate deploy`: la cadena de migraciones del
      # repo no es reproducible sobre una base VACÍA (la migración
      # 20260714000000_add_hardware_store_business_type usa el enum BusinessType
      # antes de que exista y aborta con P3018/42704). En una base efímera sin
      # datos no hay riesgo de perder nada, y db push además genera el cliente
      # de Prisma que necesitan los tests. Para desarrollo y producción se
      # sigue usando `npm run db:migrate` (ver README/QUICKSTART).
      - name: Preparar el esquema de la base de pruebas
        run: npm run db:push -w @sadel/backend
        env:
          DATABASE_URL: postgresql://sadel:sadel_test@localhost:5432/sadel_test
      - run: npm run test -w @sadel/backend
        env:
          DATABASE_URL: postgresql://sadel:sadel_test@localhost:5432/sadel_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-not-for-production
          NODE_ENV: test

  build:
    name: Build web apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @sadel/shared
      - run: npm run build -w @sadel/web-customer
      - run: npm run build -w @sadel/web-admin
      - run: npm run build -w @sadel/web-restaurant
      - run: npm run build -w @sadel/web-driver
