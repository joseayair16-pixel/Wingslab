name: wingslab-quarantined
services:
  postgres:
    profiles: [legacy-blocked]
    entrypoint: ["sh", "-c", "echo 'WingsLab: legacy service blocked' >&2; exit 1"]
    image: postgres:16-alpine
    container_name: wingslab-quarantined-postgres
    environment:
      POSTGRES_USER: sadel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sadel_password_dev}
      POSTGRES_DB: sadel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadel_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sadel-network

  redis:
    profiles: [legacy-blocked]
    entrypoint: ["sh", "-c", "echo 'WingsLab: legacy service blocked' >&2; exit 1"]
    image: redis:7-alpine
    container_name: wingslab-quarantined-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sadel-network

  backend:
    profiles: [legacy-blocked]
    entrypoint: ["node", "-e", "throw new Error('WingsLab: legacy service blocked')"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: wingslab-quarantined-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://sadel_user:${POSTGRES_PASSWORD:-sadel_password_dev}@postgres:5432/sadel_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sadel-network

  web-restaurant:
    profiles: [legacy-blocked]
    entrypoint: ["node", "-e", "throw new Error('WingsLab: legacy service blocked')"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: web-restaurant
        PORT: 3002
    container_name: wingslab-quarantined-web-restaurant
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sadel-network

  web-customer:
    profiles: [legacy-blocked]
    entrypoint: ["node", "-e", "throw new Error('WingsLab: legacy service blocked')"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: web-customer
        PORT: 3003
    container_name: wingslab-quarantined-web-customer
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3003:3003"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sadel-network

  web-driver:
    profiles: [legacy-blocked]
    entrypoint: ["node", "-e", "throw new Error('WingsLab: legacy service blocked')"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        APP: web-driver
        PORT: 3004
    container_name: wingslab-quarantined-web-driver
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3004:3004"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sadel-network

volumes:
  postgres_data:
  redis_data:

networks:
  sadel-network:
    driver: bridge
